services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_mantenimiento}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sistema_mantenimiento}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/backend
    env_file: .env
    environment:
      # Dentro de la red de Docker los hosts son los nombres de servicio, no localhost.
      POSTGRES_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sistema_mantenimiento}
      MONGO_DB_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
    # Aplica las migraciones pendientes y después arranca la API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./apps/backend/app:/code/app
      # Permite crear migraciones dentro del contenedor y que aparezcan en su carpeta local.
      - ./apps/backend/alembic:/code/alembic
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}

  # frontend:
  #   Lo añade el equipo de frontend cuando lo necesite (build: ./apps/frontend).

volumes:
  pgdata:
  mongodata:
